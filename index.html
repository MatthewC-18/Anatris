<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <!-- THEME, BEFORE FIRST PAINT.
         The public site can be light or dark. If the class were only applied
         once React mounted, every visit would paint one theme and then visibly
         flip to the other — the classic flash-of-wrong-theme. This runs
         synchronously in <head>, before any CSS is painted, so the very first
         frame is already correct. Storage key and class names must stay in sync
         with src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('anatris.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.add(theme === 'dark' ? 'theme-ink' : 'theme-paper');
          root.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#070b14' : '#fafaf8');
        } catch (e) {
          /* storage blocked: fall through to the CSS default (ink) */
        }
      })();
    </script>
    <!-- Installable on iPad/iOS: run standalone (no browser chrome), dark status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anatris" />
    <meta
      name="description"
      content="Atlas tridimensional de anatomía y movimiento para fisioterapia: rango articular, actividad muscular por tramo, tests ortopédicos y contenido citado a obras de referencia."
    />
    <title>Anatris | Anatomía clínica y biomecánica para fisioterapia</title>

    <!-- SHARE PREVIEW (Open Graph + Twitter).
         Without these, an Anatris link pasted into WhatsApp — the channel this
         product actually spreads through — renders as bare text, and the same
         on LinkedIn, the professional one. The card is generated by
         `npm run gen-og-image`; replace it with a real frame of the movement
         lab when you have one (see docs/hero-clip.md).
         NOTE: these are STATIC, so every route previews the same card. Per-route
         cards need prerendering — tracked as S12 in docs/plan-maestro-2026.md. -->
    <link rel="canonical" href="https://anatris.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anatris" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://anatris.app/" />
    <meta
      property="og:title"
      content="Anatris | Anatomía y movimiento para fisioterapia"
    />
    <meta
      property="og:description"
      content="Atlas tridimensional y laboratorio de movimiento. Sitúa la articulación en el grado que te interesa y consulta qué músculos trabajan ahí, con qué función y de qué obra procede el dato."
    />
    <meta property="og:image" content="https://anatris.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Anatris: goniómetro midiendo 116 grados de abducción de hombro, con marcadores de rol muscular a lo largo del recorrido."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Anatris | Anatomía y movimiento para fisioterapia"
    />
    <meta
      name="twitter:description"
      content="Atlas tridimensional y laboratorio de movimiento para fisioterapia, con cada dato citado a su fuente."
    />
    <meta name="twitter:image" content="https://anatris.app/og-image.png" />
  </head>
  <body class="bg-ink-950 text-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
